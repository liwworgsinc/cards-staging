<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Email Signature Generator | LIW Cards Staging</title><style>body{margin:0;background:#f4f6fb;color:#101b35;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 18px}.hero,.card{background:#fff;border:1px solid #e1e6ef;border-radius:18px;padding:22px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#0b1438,#20366f);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:6px;margin-bottom:10px}.field input{padding:11px;border:1px solid #ccd4e2;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;background:#0b1438;color:#fff;text-decoration:none;display:inline-block}.preview{min-height:180px;border:1px dashed #cbd3e2;border-radius:12px;padding:18px}.status{min-height:20px;margin-top:10px;color:#667085;font-size:.86rem}.cta{text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>Free Email Signature Generator</h1><p>Build a clean signature, then connect it to your LIW digital business card.</p></section><section class="grid"><div class="card"><label class="field">Name<input id="name" value="Jane Smith"></label><label class="field">Title<input id="title" value="Business Owner"></label><label class="field">Business<input id="business" value="My Business"></label><label class="field">Phone<input id="phone" value="(718) 555-0100"></label><label class="field">Email<input id="email" value="hello@example.com"></label><label class="field">Website / LIW Card URL<input id="url" value="https://cards.liwworgs.com"></label><button class="btn" id="copy" type="button">Copy signature text</button><div class="status" id="copy-status" aria-live="polite"></div></div><div class="card"><h2>Preview</h2><div class="preview" id="preview"></div></div></section><section class="card cta"><h2>Want more than a signature?</h2><p>Create a complete digital business card with your links, services, QR code and contact actions.</p><a class="btn" href="../register.html">Create an LIW Card</a></section></main><script>const ids=['name','title','business','phone','email','url'];const copyBtn=document.getElementById('copy');const copyStatus=document.getElementById('copy-status');function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function values(){return Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value.trim()]))}function signatureText(){const v=values();return `${v.name}\n${v.title}${v.business?' · '+v.business:''}\n${v.phone}\n${v.email}\n${v.url}`}function render(){const v=values();document.getElementById('preview').innerHTML=`<strong style="font-size:18px">${esc(v.name)}</strong><br>${esc(v.title)}${v.business?' · '+esc(v.business):''}<br><br>${esc(v.phone)}<br><a href="mailto:${esc(v.email)}">${esc(v.email)}</a><br><a href="${esc(v.url)}">${esc(v.url)}</a>`}async function copyText(text){if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);return true}catch{}}const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);let ok=false;try{ok=document.execCommand('copy')}catch{}ta.remove();return ok}ids.forEach(id=>document.getElementById(id).addEventListener('input',render));copyBtn.onclick=async()=>{const ok=await copyText(signatureText());copyBtn.textContent=ok?'Copied!':'Copy failed';copyStatus.textContent=ok?'Signature copied to your clipboard.':'Your browser blocked clipboard access. Select the preview text and copy it manually.';setTimeout(()=>{copyBtn.textContent='Copy signature text'},1400)};render()</script></body></html>
