<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Digital Business Card Score | LIW Cards Staging</title><style>body{margin:0;background:#f4f6fb;color:#101b35;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 18px}.hero,.card{background:#fff;border:1px solid #e1e6ef;border-radius:18px;padding:22px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#0b1438,#20366f);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.item{display:flex;gap:10px;padding:12px;border:1px solid #e2e7ef;border-radius:12px;margin-bottom:9px}.score{display:grid;place-items:center;width:150px;height:150px;margin:8px auto 18px;border-radius:50%;background:conic-gradient(#0b1438 0deg,#e8ecf3 0deg);position:relative}.score:before{content:"";position:absolute;inset:14px;border-radius:50%;background:white}.score strong{position:relative;font-size:2rem}.recs{display:grid;gap:9px}.recs div{padding:11px;border-radius:10px;background:#f6f8fc}.btn{display:inline-block;border-radius:10px;padding:11px 15px;font-weight:700;background:#0b1438;color:#fff;text-decoration:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>Digital Business Card Score</h1><p>Check whether your card is ready to turn views into calls, clicks and customers.</p></section><section class="grid"><div class="card"><h2>Check your card</h2><label class="item"><input type="checkbox" data-points="15"><span><strong>Clear profile photo or logo</strong><br>People can quickly recognize you or the business.</span></label><label class="item"><input type="checkbox" data-points="15"><span><strong>Name, title and business are complete</strong><br>Your identity is obvious immediately.</span></label><label class="item"><input type="checkbox" data-points="15"><span><strong>At least two contact actions</strong><br>Call, text, email, booking or website.</span></label><label class="item"><input type="checkbox" data-points="15"><span><strong>Services or products are visible</strong><br>Visitors understand what you offer.</span></label><label class="item"><input type="checkbox" data-points="10"><span><strong>Social proof</strong><br>Reviews, examples, portfolio or testimonials.</span></label><label class="item"><input type="checkbox" data-points="10"><span><strong>Strong CTA</strong><br>A clear next step such as Book, Call or Get a Quote.</span></label><label class="item"><input type="checkbox" data-points="10"><span><strong>Brand colors are readable</strong><br>Text and buttons have strong contrast.</span></label><label class="item"><input type="checkbox" data-points="10"><span><strong>QR / share-ready</strong><br>The card is easy to distribute offline and online.</span></label></div><div class="card"><h2>Your score</h2><div class="score" id="meter"><strong id="score">0</strong></div><div class="recs" id="recs"></div></div></section><section class="card" style="text-align:center"><h2>Build the missing pieces with LIW Cards</h2><p>Use templates, contact actions, services, QR sharing and more in one digital card.</p><a class="btn" href="../register.html">Create an LIW Card</a></section></main><script>const boxes=[...document.querySelectorAll('[data-points]')],score=document.getElementById('score'),meter=document.getElementById('meter'),recs=document.getElementById('recs');function run(){const total=boxes.reduce((n,b)=>n+(b.checked?Number(b.dataset.points):0),0);score.textContent=total;meter.style.background=`conic-gradient(#0b1438 ${total*3.6}deg,#e8ecf3 0deg)`;const missing=boxes.filter(b=>!b.checked).slice(0,4).map(b=>b.parentElement.querySelector('strong').textContent);recs.innerHTML=missing.length?missing.map(x=>`<div>Improve: ${x}</div>`).join(''):'<div>Your card checks every item on this scorecard.</div>'}boxes.forEach(b=>b.addEventListener('change',run));run()</script></body></html>
