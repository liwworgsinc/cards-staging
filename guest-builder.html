<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
  <title>Opening LIW Cards Builder…</title>
  <meta http-equiv="refresh" content="0;url=start/">
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f9ff;color:#111827;font-family:Inter,system-ui,sans-serif}.redirect{padding:28px;text-align:center}.redirect img{width:170px;max-width:70vw;margin-bottom:18px}.redirect p{color:#667085}.redirect a{color:#3159d8;font-weight:800}</style>
</head>
<body>
  <main class="redirect">
    <img src="assets/liw-cards-logo.svg?v=20261002-exact1" alt="LIW Cards">
    <p>Opening the new interactive card builder…</p>
    <a id="fallback-link" href="start/">Continue</a>
  </main>
  <script>
    (function(){
      const target=new URL('start/',location.href);
      const current=new URL(location.href);
      current.searchParams.forEach((value,key)=>target.searchParams.set(key,value));
      const fallback=document.getElementById('fallback-link');
      fallback.href=target.href;
      location.replace(target.href);
    })();
  </script>
</body>
</html>
