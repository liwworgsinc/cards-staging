<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1438">
  <meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
  <title>Signing In | LIW Digital Cards</title>
  <link rel="stylesheet" href="css/styles.css?v=20260806-10700">
  <style>
    .callback-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#081433,#1c2e62)}
    .callback-card{width:min(100%,520px);padding:40px;text-align:center;background:#fff;border-radius:24px;box-shadow:0 25px 70px rgba(0,0,0,.25)}
    .callback-card .brand-logo{width:210px;max-width:75%;height:auto;margin:0 auto 28px}
    .callback-icon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;background:#f5ecd9;color:#9b7229}
    .callback-card h1{margin:0 0 12px}
    #callback-message{color:#667085;line-height:1.6}
    #callback-message[data-state="success"]{color:#087443}
    #callback-message[data-state="error"]{color:#b42318}
    #callback-login{margin-top:24px}
  </style>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32-v1062.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16-v1062.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-v1062.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LIW Cards">
  <style data-staging-qa-position>#liw-staging-plan-qa{left:14px!important;right:auto!important}</style>
</head>
<body>
  <main class="callback-shell">
    <section class="callback-card">
      <img class="brand-logo" src="assets/liw-worgs-logo.png" alt="LIW Worgs Inc">
      <div class="callback-icon"><i data-lucide="shield-check" size="30"></i></div>
      <h1>Signing you in</h1>
      <p id="callback-message" data-state="working">Please wait while we securely finish your LIW Digital Cards sign-in.</p>
      <a id="callback-login" class="btn btn-primary" href="login.html" hidden>Go to login</a>
    </section>
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8"></script>
  <script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.110.8"><\/script>')}</script>
  <script src="js/config.js?v=20260829-login2"></script>
  <script src="js/referral.js?v=20260812-2"></script>
  <script src="js/auth-callback.js?v=20260829-login2"></script>
  <script>if(window.lucide)lucide.createIcons();</script>
  <script src="js/pwa-install.js?v=20260813-3"></script>
</body>
</html>
