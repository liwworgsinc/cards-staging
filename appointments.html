<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="#13162a" name="theme-color"/>
<meta content="Open LIW GetBookd, the booking workspace for LIW Cards." name="description"/>
<meta content="noindex,nofollow,noarchive" name="robots"/>
<title>GetBookd | LIW Cards</title>
<link href="css/styles.css?v=20260806-10700" rel="stylesheet"/>
<link href="assets/icons/liw-cards-icon.svg?v=20261002-icon2" rel="icon" sizes="any" type="image/svg+xml"/>
<style>
  body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#f4f6fb;color:#101b35;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .getbookd-handoff{width:min(560px,100%);padding:32px;border:1px solid #dfe5ef;border-radius:24px;background:#fff;box-shadow:0 20px 60px rgba(11,20,56,.12);text-align:center}
  .getbookd-mark{width:58px;height:58px;margin:0 auto 16px;display:grid;place-items:center;border-radius:18px;background:#101b35;color:#fff}
  .getbookd-handoff h1{margin:0;font-size:clamp(1.8rem,5vw,2.45rem)}
  .getbookd-handoff p{margin:12px auto 22px;max-width:440px;color:#667085;line-height:1.6}
  .getbookd-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  .getbookd-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:12px;text-decoration:none;font-weight:800}
  .getbookd-primary{background:#101b35;color:#fff}
  .getbookd-secondary{background:#eef2f7;color:#101b35}
  .getbookd-status{display:block;margin-top:18px;color:#98a2b3;font-size:.88rem}
</style>
</head>
<body>
<main class="getbookd-handoff">
  <div class="getbookd-mark" aria-hidden="true">GB</div>
  <h1>Opening LIW GetBookd</h1>
  <p>GetBookd is now the booking home for LIW Cards. Manage services, availability, appointments, and your customer booking experience there.</p>
  <div class="getbookd-actions">
    <a class="getbookd-primary" href="https://getbookd.liwworgs.com/dashboard.html">Open GetBookd</a>
    <a class="getbookd-secondary" href="dashboard.html">Back to Cards</a>
  </div>
  <span class="getbookd-status">Taking you to your booking workspace…</span>
</main>
<script>
  window.setTimeout(function(){
    window.location.replace('https://getbookd.liwworgs.com/dashboard.html');
  }, 450);
</script>
</body>
</html>
