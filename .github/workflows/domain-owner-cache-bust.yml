name: Domain owner checkout cache bust
on:
  push:
    paths:
      - '.github/workflows/domain-owner-cache-bust.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump domain checkout cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('domains.html')
          s = p.read_text()
          old = 'js/domain-config-bridge-staging.js?v=20260829-domain-stripe-2'
          new = 'js/domain-config-bridge-staging.js?v=20260830-domain-owner-3'
          if old not in s:
              raise SystemExit('old cache key not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Validate checkout JavaScript syntax
        run: node --check js/domain-stripe-checkout-staging.js
      - name: Commit cache bust
        run: |
          git config user.name 'LIW Cards Staging Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add domains.html
          git commit -m 'Bust cache for domain owner checkout'
          git push
