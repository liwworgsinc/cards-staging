name: Domain Stripe staging patch once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/domain-stripe-staging-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch domain checkout cache and busy guard
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('js/domain-stripe-checkout-staging.js')
          text = js.read_text()
          text = text.replace("  const client = window.supabaseClient;\n", "  const client = window.supabaseClient;\n  let checkoutBusy = false;\n", 1)
          text = text.replace("    if (next.disabled === allowed) next.disabled = !allowed;", "    const shouldDisable = checkoutBusy || !allowed;\n    if (next.disabled !== shouldDisable) next.disabled = shouldDisable;", 1)
          text = text.replace("  function setButtonBusy(busy, label = '') {\n    next.disabled = busy || !canPurchase();", "  function setButtonBusy(busy, label = '') {\n    checkoutBusy = busy;\n    next.disabled = busy || !canPurchase();", 1)
          js.write_text(text)

          html = Path('domains.html')
          page = html.read_text()
          page = page.replace('js/domain-config-bridge-staging.js?v=20260829-1', 'js/domain-config-bridge-staging.js?v=20260829-domain-stripe-1')
          html.write_text(page)
          PY
      - name: Commit patch
        run: |
          git config user.name "liwworgsinc"
          git config user.email "liwworgsinc@gmail.com"
          git add js/domain-stripe-checkout-staging.js domains.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable protected Stripe domain checkout on staging"
          git push origin main
