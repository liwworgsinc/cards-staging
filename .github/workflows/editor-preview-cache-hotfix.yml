name: Editor preview cache hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editor-preview-cache-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch editor preview cache tags
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('editor.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'js/config.js?v=20260811-2',
              'js/config.js?v=20260829-preview-cache-1'
          )
          text = text.replace(
              'js/editor.js?v=20260812-6',
              'js/editor.js?v=20260829-preview-cache-1'
          )

          marker = '<script src="js/editor-post-publish-share.js?v=20260812-2"></script>'
          hotfix = '<script src="js/editor-preview-save-fix-staging.js?v=20260829-preview-save-3"></script>'
          if hotfix not in text:
              if marker not in text:
                  raise SystemExit('editor post-publish script marker not found')
              text = text.replace(marker, hotfix + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit staging editor hotfix
        shell: bash
        run: |
          if git diff --quiet -- editor.html; then
            echo "Editor already patched"
            exit 0
          fi
          git config user.name "LIW Cards Staging Bot"
          git config user.email "actions@users.noreply.github.com"
          git add editor.html
          git commit -m "Fix cached authenticated draft preview"
          git push
