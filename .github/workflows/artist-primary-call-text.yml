name: Fix Artist primary Call and Text routing

on:
  push:
    paths:
      - artist-primary-call-text.trigger

permissions:
  contents: write

jobs:
  patch-artist-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Artist primary routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          public = Path('js/public-artist-performer-modules-v2-staging.js')
          text = public.read_text()
          pattern = r"  function route\(grid\)\{.*?\n  \}\n\n  function adaptPrimary\(\)\{"
          replacement = textwrap.dedent(r'''
          function route(grid){
            const card=grid.closest('#card.music-card-active');const rail=swipeRail(card);if(!rail)return;
            const type=safe(settings?.performer_type,40).toLowerCase();
            const podcast=card.querySelector('[data-liw-artist-module="podcast"]');
            const call=card.querySelector('[data-liw-artist-module="call"]');
            const text=card.querySelector('[data-liw-artist-module="text"]');
            const podcastPrimary=Boolean(podcast&&settings?.podcast_enabled===true&&(!coreVisible('music')||type==='podcaster'||type==='comedian'));

            /* Call and Text are always primary when enabled. They consume one or two
               of the six large home slots; lower-priority actions are pushed to Swipe. */
            const reserved=[];
            if(podcastPrimary&&podcast)reserved.push(podcast);
            if(settings?.call_enabled===true&&call)reserved.push(call);
            if(settings?.text_enabled===true&&text)reserved.push(text);

            reserved.forEach(node=>{node.classList.remove('music-bottom-swipe-item');if(node.parentNode!==grid)grid.appendChild(node);});
            if(podcastPrimary&&podcast&&grid.firstElementChild!==podcast)grid.prepend(podcast);

            const reservedSet=new Set(reserved);
            const candidates=[...grid.querySelectorAll(':scope > .music-luxe-tile')].filter(node=>!reservedSet.has(node));
            const openSlots=Math.max(0,6-reserved.length);
            const keep=candidates.slice(0,openSlots);
            const desired=[...(podcastPrimary&&podcast?[podcast]:[]),...keep,...reserved.filter(node=>node!==podcast)];
            const desiredSet=new Set(desired);

            [...grid.querySelectorAll(':scope > .music-luxe-tile')].forEach(node=>{
              if(desiredSet.has(node))return;
              node.classList.add('music-bottom-swipe-item');rail.appendChild(node);
            });
            desired.forEach(node=>{node.classList.remove('music-bottom-swipe-item');grid.appendChild(node);});

            if(!podcastPrimary&&podcast&&settings?.podcast_enabled===true&&podcast.parentNode!==grid){
              const current=[...grid.querySelectorAll(':scope > .music-luxe-tile')];
              if(current.length<6){podcast.classList.remove('music-bottom-swipe-item');grid.appendChild(podcast);}
              else podcast.classList.add('music-bottom-swipe-item');
            }

            while(grid.querySelectorAll(':scope > .music-luxe-tile').length>6){
              const nodes=[...grid.querySelectorAll(':scope > .music-luxe-tile')];
              const movable=[...nodes].reverse().find(node=>!reservedSet.has(node));
              if(!movable)break;movable.classList.add('music-bottom-swipe-item');rail.appendChild(movable);
            }
            rail.dataset.itemCount=String(rail.children.length);
          }

          window.LIWArtistPerformerModules={
            route(){const grid=document.querySelector('#card.music-card-active .music-luxe-grid');if(grid)route(grid);}
          };

          function adaptPrimary(){
          ''').lstrip()
          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'performer route patch count={count}')
          public.write_text(new_text)

          hub = Path('js/public-music-artist-hub-v2-staging.js')
          text = hub.read_text()
          old = "    return true;\n  }\n\n  function configuredReleaseTitle()"
          new = "    setTimeout(()=>window.LIWArtistPerformerModules?.route?.(),0);\n    return true;\n  }\n\n  function configuredReleaseTitle()"
          if old not in text:
              raise SystemExit('Artist Hub navGroups anchor missing')
          hub.write_text(text.replace(old,new,1))

          wallet = Path('js/public-music-wallet-top-staging.js')
          text = wallet.read_text()
          old = 'js/public-artist-performer-modules-v2-staging.js?v=20260907-six-tile-1'
          new = 'js/public-artist-performer-modules-v2-staging.js?v=20260907-primary-call-text-1'
          if old not in text:
              raise SystemExit('performer child cache anchor missing')
          wallet.write_text(text.replace(old,new,1))

          card = Path('card.html')
          text = card.read_text()
          replacements = [
            ('js/public-music-artist-hub-v2-staging.js?v=20260907-performer-type-1','js/public-music-artist-hub-v2-staging.js?v=20260907-primary-call-text-1'),
            ('js/public-music-wallet-top-staging.js?v=20260907-wallet-top-4','js/public-music-wallet-top-staging.js?v=20260907-wallet-top-5'),
          ]
          for old,new in replacements:
              if old not in text:
                  raise SystemExit(f'card cache anchor missing: {old}')
              text=text.replace(old,new,1)
          card.write_text(text)
          PY
      - name: Validate Artist routing
        run: |
          node --check js/public-artist-performer-modules-v2-staging.js
          node --check js/public-music-artist-hub-v2-staging.js
          node --check js/public-music-wallet-top-staging.js
          grep -q 'Call and Text are always primary' js/public-artist-performer-modules-v2-staging.js
          grep -q 'window.LIWArtistPerformerModules' js/public-artist-performer-modules-v2-staging.js
          grep -q 'LIWArtistPerformerModules?.route' js/public-music-artist-hub-v2-staging.js
          grep -q 'public-artist-performer-modules-v2-staging.js?v=20260907-primary-call-text-1' js/public-music-wallet-top-staging.js
          grep -q 'public-music-wallet-top-staging.js?v=20260907-wallet-top-5' card.html
      - name: Commit Artist primary routing
        run: |
          git config user.name "LIW Cards Automation"
          git config user.email "liwworgsinc@gmail.com"
          git add js/public-artist-performer-modules-v2-staging.js js/public-music-artist-hub-v2-staging.js js/public-music-wallet-top-staging.js card.html
          git diff --cached --quiet && exit 0
          git commit -m "Keep Call and Text in Artist primary six"
          git push
