name: Fix Music swipe role label

on:
  push:
    paths:
      - music-more-role-label.trigger

permissions:
  contents: write

jobs:
  patch-role-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep performer-aware More label
        run: |
          python3 - <<'PY'
          from pathlib import Path

          performer = Path('js/public-artist-performer-modules-v2-staging.js')
          text = performer.read_text()
          old = "if(title&&title.parentNode!==head)head.appendChild(title);if(title)title.textContent='More';"
          new = "if(title&&title.parentNode!==head)head.appendChild(title);if(title&&!String(title.textContent||'').trim())title.textContent='More';"
          if old not in text:
              raise SystemExit('performer More-label anchor missing')
          performer.write_text(text.replace(old, new, 1))

          swipe = Path('js/public-music-bottom-swipe-staging.js')
          text = swipe.read_text()
          old = "    if(title)title.textContent='More';"
          new = "    if(title&&!String(title.textContent||'').trim())title.textContent='More';"
          if old not in text:
              raise SystemExit('bottom swipe More-label anchor missing')
          swipe.write_text(text.replace(old, new, 1))

          wallet = Path('js/public-music-wallet-top-staging.js')
          text = wallet.read_text()
          old = 'js/public-artist-performer-modules-v2-staging.js?v=20260907-primary-call-text-1'
          new = 'js/public-artist-performer-modules-v2-staging.js?v=20260907-more-role-label-1'
          if old not in text:
              raise SystemExit('performer loader cache anchor missing')
          wallet.write_text(text.replace(old, new, 1))

          card = Path('card.html')
          text = card.read_text()
          replacements = [
              ('js/public-music-bottom-swipe-staging.js?v=20260907-bottom-swipe-3','js/public-music-bottom-swipe-staging.js?v=20260907-bottom-swipe-4'),
              ('js/public-music-wallet-top-staging.js?v=20260907-wallet-top-5','js/public-music-wallet-top-staging.js?v=20260907-wallet-top-6'),
          ]
          for old,new in replacements:
              if old not in text:
                  raise SystemExit(f'card cache anchor missing: {old}')
              text = text.replace(old,new,1)
          card.write_text(text)
          PY
      - name: Validate Music scripts
        run: |
          node --check js/public-artist-performer-modules-v2-staging.js
          node --check js/public-music-bottom-swipe-staging.js
          node --check js/public-music-wallet-top-staging.js
          grep -q "title&&!String(title.textContent||'').trim()" js/public-artist-performer-modules-v2-staging.js
          grep -q "title&&!String(title.textContent||'').trim()" js/public-music-bottom-swipe-staging.js
          grep -q 'public-artist-performer-modules-v2-staging.js?v=20260907-more-role-label-1' js/public-music-wallet-top-staging.js
          grep -q 'public-music-bottom-swipe-staging.js?v=20260907-bottom-swipe-4' card.html
          grep -q 'public-music-wallet-top-staging.js?v=20260907-wallet-top-6' card.html
      - name: Commit role label fix
        run: |
          git config user.name "LIW Cards Automation"
          git config user.email "liwworgsinc@gmail.com"
          git add js/public-artist-performer-modules-v2-staging.js js/public-music-bottom-swipe-staging.js js/public-music-wallet-top-staging.js card.html
          git diff --cached --quiet && exit 0
          git commit -m "Keep performer role in Music swipe label"
          git push
