name: Clean domain agreement labels
on:
  push:
    paths:
      - '.github/workflows/clean-domain-agreement-labels.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean customer-facing agreement labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/domain-stripe-checkout-staging.js')
          s = p.read_text()
          old = "escapeHtml(item.title || item.agreementType || 'Domain registration agreement')"
          new = "escapeHtml(agreementDisplayName(item))"
          if old not in s:
              raise SystemExit('agreement label expression not found')
          s = s.replace(old, new, 1)
          marker = "  function money(cents, currency = 'usd') {"
          helper = """  function agreementDisplayName(item = {}) {\n    const raw = String(item.title || item.agreementType || '').trim();\n    const key = raw.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();\n    if (key.includes('domains by proxy')) return 'Domain Privacy Agreement';\n    if (key.includes('api domain purchase')) return 'Domain Registration Agreement';\n    if (key.includes('domain purchase')) return 'Domain Registration Agreement';\n    return raw || 'Domain Registration Agreement';\n  }\n\n"""
          if marker not in s:
              raise SystemExit('money helper marker not found')
          s = s.replace(marker, helper + marker, 1)
          s = s.replace("const API_VERSION = '20260830-domain-owner-3';", "const API_VERSION = '20260830-domain-owner-4';", 1)
          p.write_text(s)

          bridge = Path('js/domain-config-bridge-staging.js')
          b = bridge.read_text()
          b = b.replace('domain-owner-3', 'domain-owner-4')
          bridge.write_text(b)

          page = Path('domains.html')
          h = page.read_text()
          h = h.replace('domain-owner-3', 'domain-owner-4')
          page.write_text(h)
          PY
      - name: Validate checkout JavaScript
        run: node --check js/domain-stripe-checkout-staging.js && node --check js/domain-config-bridge-staging.js
      - name: Commit label cleanup
        run: |
          git config user.name 'LIW Cards Staging Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/domain-stripe-checkout-staging.js js/domain-config-bridge-staging.js domains.html
          git commit -m 'Clean domain agreement labels'
          git push
