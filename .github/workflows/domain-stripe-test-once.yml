name: Domain Stripe regression once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/domain-stripe-test-once.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check domain Stripe JavaScript syntax
        run: node --check js/domain-stripe-checkout-staging.js
      - name: Run domain Stripe regression test
        run: node --test tests/unit/domain-stripe-checkout-staging.test.mjs
