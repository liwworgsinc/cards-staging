name: Apply production Preview parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-preview-production-parity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mount production-parity Preview failsafe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('editor.html')
          html = path.read_text(encoding='utf-8')

          html = re.sub(r'js/config\.js\?v=[^\"\']+', 'js/config.js?v=20260829-preview-expert-1', html, count=1)
          html = re.sub(r'js/editor\.js\?v=[^\"\']+', 'js/editor.js?v=20260829-preview-expert-1', html, count=1)

          parity = '<script src="js/editor-preview-production-parity-staging.js?v=20260829-preview-expert-1"></script>'
          if 'editor-preview-production-parity-staging.js' not in html:
              match = re.search(r'(<script src="js/editor\.js\?v=[^\"]+"></script>)', html)
              if not match:
                  raise SystemExit('editor.js script tag not found')
              html = html[:match.end()] + parity + html[match.end():]

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit Preview parity mount
        shell: bash
        run: |
          git config user.name "LIW Cards Staging Bot"
          git config user.email "actions@users.noreply.github.com"
          git add editor.html
          if git diff --cached --quiet; then
            echo "Preview parity already mounted"
            exit 0
          fi
          git commit -m "Mount production-parity Preview failsafe"
          git push
