name: Apply assigned designer editor patch

on:
  push:
    paths:
      - designer-editor-patch.trigger

permissions:
  contents: write

jobs:
  patch-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch editor permissions and save route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/editor.js')
          text = path.read_text()
          old = """    currentTeamRole = membership?.role || null;
    if (!currentTeamRole) {
      toast('This card belongs to another account and is not shared with you.');
      setTimeout(() => location.replace('dashboard.html'), 350);
      return;
    }
    canEditCurrentCard = currentTeamRole === 'editor';"""
          new = """    currentTeamRole = membership?.role || null;
    if (currentTeamRole !== 'editor') {
      const { data: designerOrder, error: designerOrderError } = await supabaseClient.from('designer_orders')
        .select('id')
        .eq('card_id', currentId)
        .eq('assigned_to', user.id)
        .neq('workflow_status', 'canceled')
        .limit(1)
        .maybeSingle();
      if (designerOrderError) console.warn('LIW assigned designer lookup failed:', designerOrderError);
      if (designerOrder?.id) {
        currentTeamRole = 'designer';
        canEditCurrentCard = true;
        const { data: designerContext, error: designerContextError } = await supabaseClient.rpc('designer_card_access_context', { p_card_id: currentId });
        if (designerContextError) throw designerContextError;
        if (designerContext) {
          currentPlan = designerContext.plan_key || 'starter';
          const designerAddonKeys = Array.isArray(designerContext.addon_keys) ? designerContext.addon_keys : [];
          activeAddons = designerAddonKeys.map(addon_key => ({ addon_key, status: 'active' }));
          templatePurchases = Array.isArray(designerContext.template_purchases) ? designerContext.template_purchases : [];
          editorAccess = {
            ...(editorAccess || {}),
            isAdmin: false,
            isPlanPreview: false,
            planKey: currentPlan,
            planName: `Customer ${titleCase(currentPlan)}`,
            has(feature) {
              const definition = addonDefinitions.find(item => item.entitlement_key === feature || item.addon_key === feature);
              return Boolean(definition?.included_plans?.includes(currentPlan) || designerAddonKeys.includes(definition?.addon_key));
            }
          };
        }
      } else if (!currentTeamRole) {
        toast('This card belongs to another account and is not assigned to you.');
        setTimeout(() => location.replace('designer-team.html'), 350);
        return;
      } else {
        canEditCurrentCard = false;
      }
    } else {
      canEditCurrentCard = true;
    }"""
          if old not in text:
              raise SystemExit('Expected editor permission block not found; refusing unsafe patch')
          text = text.replace(old, new, 1)
          old_save = "response = await fetch(`${LIW_CONFIG.supabaseUrl}/functions/v1/save-card-state`, {"
          new_save = "const saveFunction = currentTeamRole === 'designer' ? 'save-designer-card-state' : 'save-card-state';\n    response = await fetch(`${LIW_CONFIG.supabaseUrl}/functions/v1/${saveFunction}`, {"
          if old_save not in text:
              raise SystemExit('Expected save-card-state call not found; refusing unsafe patch')
          text = text.replace(old_save, new_save, 1)
          path.write_text(text)
          PY
      - name: Commit editor patch
        run: |
          git config user.name "LIW Cards Automation"
          git config user.email "liwworgsinc@gmail.com"
          git add js/editor.js
          git diff --cached --quiet && exit 0
          git commit -m "Allow assigned designers to edit customer card"
          git push
