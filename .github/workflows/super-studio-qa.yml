name: Super Studio QA

on:
  push:
    branches: [super-studio, main]
    paths:
      - 'js/super-studio-*.js'
      - 'css/super-studio-*.css'
      - 'js/editor-experience-state-guard-staging.js'
      - 'js/public-booking-mode-v2-loader-staging.js'
      - 'supabase/staging/super-studio-state.sql'
      - 'supabase/migrations/20261011_allow_super_studio_card_experience.sql'
      - 'tests/unit/super-studio*.test.mjs'
      - '.github/workflows/super-studio-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Super Studio runtimes
        run: |
          node --check js/super-studio-config-staging.js
          node --check js/super-studio-editor-staging.js
          node --check js/super-studio-editor-enhancements-staging.js
          node --check js/super-studio-preview-parity-staging.js
          node --check js/super-studio-layout-v2-staging.js
          node --check js/super-studio-hero-v4-staging.js
          node --check js/super-studio-public-staging.js
          node --check js/super-studio-public-enhancements-staging.js
          node --check js/editor-experience-state-guard-staging.js
          node --check js/public-booking-mode-v2-loader-staging.js
      - name: Run Super Studio regression tests
        run: node --test tests/unit/super-studio*.test.mjs
