name: Sync production public card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-production-public-card.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy proven production public card
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/liwworgsinc/cards/main/card.html -o card.html
          curl -fsSL https://raw.githubusercontent.com/liwworgsinc/cards/main/js/public-card.js -o js/public-card.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('card.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'js/config\.js\?v=[^"\']+', 'js/config.js?v=20260830-prod-card-exact-1', s, count=1)
          s=re.sub(r'js/public-card\.js\?v=[^"\']+', 'js/public-card.js?v=20260830-prod-card-exact-1', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit exact production card renderer
        shell: bash
        run: |
          git config user.name "LIW Cards Staging Bot"
          git config user.email "actions@users.noreply.github.com"
          git add card.html js/public-card.js
          git commit -m "Sync staging public card with working production renderer"
          git push
