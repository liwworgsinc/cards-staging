name: Sync production public card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-production-public-card.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match the proven production public-card stack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          card_path = Path('card.html')
          html = card_path.read_text(encoding='utf-8')

          # Remove staging-only public-card presentation/controller assets.
          html = html.replace('<link href="css/swipe-save-top.css?v=20260815-4" rel="stylesheet"/>\n', '')
          html = html.replace('<link href="css/swipe-contact-polish-staging.css?v=20260816-contact-1" rel="stylesheet"/>\n', '')
          html = html.replace('<link href="css/public-card-layout-polish-staging.css?v=20260818-layout-2" rel="stylesheet"/>\n', '')
          html = html.replace('<style data-staging-qa-position>#liw-staging-plan-qa{left:14px!important;right:auto!important}</style>\n', '')
          html = html.replace('<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">\n', '')
          if 'css/public-card-share-home.css' not in html:
              anchor = '<link href="css/swipe-premium-cues.css?v=20260812-3" rel="stylesheet"/>\n'
              if anchor not in html:
                  raise SystemExit('public card stylesheet anchor not found')
              html = html.replace(anchor, anchor + '<link href="css/public-card-share-home.css?v=20260821-1" rel="stylesheet"/>\n', 1)

          # Production script order, but with a fresh staging cache key for the two core files.
          start = html.find('<script src="https://unpkg.com/lucide@1.27.0"></script>')
          end = html.rfind('</body>')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('public card script stack not found')
          production_stack = '''<script src="https://unpkg.com/lucide@1.27.0"></script>
<script src="vendor/supabase-2.110.8.js"></script>
<script src="js/config.js?v=20260830-prod-card-stack-1"></script>
<script src="js/referral.js?v=20260812-2"></script>
<script src="js/common.js?v=20260812-6"></script>
<script src="js/social-icons.js?v=20260811-2"></script>
<script src="js/social-icons-extra.js?v=20260811-1"></script>
<script src="js/qr-safe.js?v=20260805-10650"></script>
<script src="js/public-card.js?v=20260830-prod-card-stack-1"></script>
<script src="js/pwa-install.js?v=20260731-1062"></script>
<script src="js/public-card-share-home.js?v=20260821-1"></script>
<script src="js/public-rich-sections.js?v=20260811-1"></script>
<script src="js/rich-section-premium.js?v=20260811-2"></script>
<script src="js/public-swipe-card.js?v=20260812-4"></script>
'''
          html = html[:start] + production_stack + html[end:]
          card_path.write_text(html, encoding='utf-8')

          # Align the only remaining staging-only branch in the core loader with production.
          js_path = Path('js/public-card.js')
          js = js_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"    // public_card_feature_access intentionally protects unpublished cards, so a.*?"
              r"    globalThis\.publicCardFeatureAccess = featureAccess;",
              re.S,
          )
          replacement = '''    // public_card_feature_access already resolves owner/team access without exposing
    // the card owner's UUID. Admin previews can still use the signed-in admin's
    // access context as a private fallback.
    if (ownerPreview && signedInUser && typeof getLiwAccessContext === 'function') {
      try {
        const previewAccess = await getLiwAccessContext(signedInUser, { refresh: true });
        if (previewAccess?.isAdmin) {
          const previewEntitlements = previewAccess?.entitlements && typeof previewAccess.entitlements === 'object'
            ? previewAccess.entitlements
            : {};
          const previewPlan = String(previewAccess?.planKey || 'starter');
          const productLimit = 30;
          const downloadLimit = 30;
          featureAccess = {
            ...featureAccess,
            ...previewEntitlements,
            flow_experience: previewAccess.has?.('flow_experience') === true,
            product_limit: Number(featureAccess.product_limit || productLimit),
            download_limit: Number(featureAccess.download_limit || downloadLimit)
          };
        }
      } catch (previewAccessError) {
        console.warn('Private preview entitlement fallback unavailable:', previewAccessError);
      }
    }

    globalThis.publicCardFeatureAccess = featureAccess;'''
          js, count = pattern.subn(replacement, js, count=1)
          if count != 1:
              raise SystemExit('production public-card loader parity block not found')
          js_path.write_text(js, encoding='utf-8')
          PY

          ! grep -q 'public-card-enhancements-staging.js' card.html
          grep -q 'public-card-share-home.js?v=20260821-1' card.html
          grep -q 'public-rich-sections.js?v=20260811-1' card.html
          grep -q 'public-swipe-card.js?v=20260812-4' card.html
          grep -q 'js/public-card.js?v=20260830-prod-card-stack-1' card.html

      - name: Commit production-equivalent public card
        shell: bash
        run: |
          git config user.name "LIW Cards Staging Bot"
          git config user.email "actions@users.noreply.github.com"
          git add card.html js/public-card.js
          if git diff --cached --quiet; then
            echo "Public card already matches production stack"
            exit 0
          fi
          git commit -m "Match staging public card to working production stack"
          git push
