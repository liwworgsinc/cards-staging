name: Hire Total Fix QA

on:
  push:
    branches:
      - fix/hire-total-legacy-stripe-20260918

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check js/hire-designer.js
          node --check js/billing.js
      - name: Check Hire total fix wiring
        run: |
          grep -q "create-designer-checkout" js/hire-designer.js
          grep -q "Use Create QA order" js/hire-designer.js
          grep -Fq "$0 today during the 7-day trial" js/hire-designer.js
          ! grep -q "mountDesignerStripeCheckout" js/billing.js
          ! grep -q "designer-stripe-checkout-staging.js" js/billing.js
          grep -q "20260918-hiretotal1" hire-designer.html
