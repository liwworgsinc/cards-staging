name: Fix editor preview wiring 2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-editor-preview-wiring-2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_preview_wiring_once.py
      - run: |
          git config user.name "LIW Cards Staging Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/editor.js editor.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Repair editor Preview wiring"
          git push
