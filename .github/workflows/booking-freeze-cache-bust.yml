name: Booking Freeze Cache Bust

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bust-cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update booking freeze-fix loader version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('card.html')
          s = p.read_text()
          old = 'js/public-booking-mode-v2-loader-staging.js?v=20260925-booking-selection-1'
          new = 'js/public-booking-mode-v2-loader-staging.js?v=20261011-observer-freeze-1'
          s2 = s.replace(old, new)
          if s2 == s:
              print('Booking loader cache key already current.')
          else:
              p.write_text(s2)
          PY
      - name: Commit cache-key update
        run: |
          if git diff --quiet -- card.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add card.html
          git commit -m 'Bust booking freeze-fix cache in staging'
          git push
