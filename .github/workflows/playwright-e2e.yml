name: Playwright E2E

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/playwright-e2e.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/playwright-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Chromium E2E + 80% coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COVERAGE_THRESHOLD: '80'

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright test runner and coverage tools
        run: npm install --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E and coverage gate
        run: npm run test:e2e

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure traces and media
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
