name: Install Artist six tile home

on:
  push:
    paths:
      - artist-six-tile-home.trigger

permissions:
  contents: write

jobs:
  install-six-tile-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Artist six tile routing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          public = Path('js/public-artist-performer-modules-v2-staging.js')
          text = public.read_text()
          replacements = [
              ('keeping the main launcher at 3x3 and overflow in More/Swipe.', 'keeping the main launcher at 2x3 and overflow in More/Swipe.'),
              ('if(count<=9)return;', 'if(count<=6)return;'),
              ('if(count<9){', 'if(count<6){'),
              ('if(count>=9)return;', 'if(count>=6)return;'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing public module anchor: {old}')
              text = text.replace(old, new, 1)
          public.write_text(text)

          wallet = Path('js/public-music-wallet-top-staging.js')
          text = wallet.read_text()
          old = 'js/public-artist-performer-modules-v2-staging.js?v=20260907-mobilefix-1'
          new = 'js/public-artist-performer-modules-v2-staging.js?v=20260907-six-tile-1'
          if old not in text:
              raise SystemExit('wallet child loader anchor missing')
          wallet.write_text(text.replace(old, new, 1))

          card = Path('card.html')
          text = card.read_text()
          old = 'js/public-music-wallet-top-staging.js?v=20260907-wallet-top-3'
          new = 'js/public-music-wallet-top-staging.js?v=20260907-wallet-top-4'
          if old not in text:
              raise SystemExit('card wallet cache anchor missing')
          card.write_text(text.replace(old, new, 1))
          PY
      - name: Validate public Artist JavaScript
        run: |
          node --check js/public-artist-performer-modules-v2-staging.js
          node --check js/public-music-wallet-top-staging.js
          grep -q 'if(count<=6)return' js/public-artist-performer-modules-v2-staging.js
          grep -q 'if(count<6)' js/public-artist-performer-modules-v2-staging.js
          grep -q 'if(count>=6)return' js/public-artist-performer-modules-v2-staging.js
          grep -q 'public-artist-performer-modules-v2-staging.js?v=20260907-six-tile-1' js/public-music-wallet-top-staging.js
          grep -q 'public-music-wallet-top-staging.js?v=20260907-wallet-top-4' card.html
      - name: Commit six tile home
        run: |
          git config user.name "LIW Cards Automation"
          git config user.email "liwworgsinc@gmail.com"
          git add js/public-artist-performer-modules-v2-staging.js js/public-music-wallet-top-staging.js card.html
          git diff --cached --quiet && exit 0
          git commit -m "Cap Artist home at six tiles"
          git push
