name: Install global preview state fix

on:
  push:
    paths:
      - preview-global-state-fix.trigger

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Validate JavaScript
        run: |
          node --check js/editor-experience-state-guard-staging.js
          node --check js/editor-save-resilience-staging-20260915.js
          node --check js/editor-preview-production-parity-staging.js
          node --check js/editor-studio-type-persistence-staging.js
          node --test tests/unit/editor-preview-global-connection-staging.test.mjs
      - name: Wire cache-fresh preview and save resilience
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('editor.html')
          text = path.read_text()
          version = '20260915-preview-save-resilience-1'
          replacements = [
              ('<script src="js/editor-experience-state-guard-staging.js?v=20260913-global-preview-2"></script>',
               f'<script src="js/editor-experience-state-guard-staging.js?v={version}"></script>'),
              ('<script src="js/editor-preview-production-parity-staging.js?v=20260913-global-preview-2"></script>',
               f'<script src="js/editor-preview-production-parity-staging.js?v={version}"></script>'),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Expected editor script anchor not found: {old}')
          path.write_text(text)
          PY
      - name: Verify wiring
        run: |
          grep -q 'editor-experience-state-guard-staging.js?v=20260915-preview-save-resilience-1' editor.html
          grep -q 'editor-preview-production-parity-staging.js?v=20260915-preview-save-resilience-1' editor.html
          ! grep -q 'editor-experience-state-guard-staging.js?v=20260913-global-preview-2' editor.html
          ! grep -q 'editor-preview-production-parity-staging.js?v=20260913-global-preview-2' editor.html
      - name: Commit editor cache bust
        run: |
          git config user.name "LIW Cards Automation"
          git config user.email "liwworgsinc@gmail.com"
          git add editor.html
          git diff --cached --quiet && exit 0
          git commit -m "Load preview save resilience with fresh assets"
          git pull --rebase origin main
          git push origin main
