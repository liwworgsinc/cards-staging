name: Install assigned designer editor bridge

on:
  push:
    paths:
      - designer-editor-bridge.trigger

permissions:
  contents: write

jobs:
  install-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject or refresh bridge after editor core
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('editor.html')
          text = path.read_text()
          bridge = '<script src="js/designer-editor-bridge-staging.js?v=20260905-complete-2"></script>'
          pattern = r'<script src="js/designer-editor-bridge-staging\.js\?v=[^"]+"></script>'
          if re.search(pattern, text):
              text = re.sub(pattern, bridge, text, count=1)
          else:
              needle = '<script src="js/editor.js?v=20260829-preview-expert-1"></script>'
              if needle not in text:
                  raise SystemExit('Editor core script tag not found; refusing unsafe injection')
              text = text.replace(needle, needle + bridge, 1)
          path.write_text(text)
          PY
      - name: Commit bridge injection
        run: |
          git config user.name "LIW Cards Automation"
          git config user.email "liwworgsinc@gmail.com"
          git add editor.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh assigned designer editor bridge"
          git push
