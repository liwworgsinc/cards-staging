name: Clean domain checkout live note
on:
  push:
    paths:
      - '.github/workflows/clean-domain-live-note.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove staging-only checkout warning
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/domain-stripe-checkout-staging.js')
          s = p.read_text()
          old = "Staging is connected to LIW's live Stripe account. Completing Stripe Checkout creates a real charge and can start a real domain registration."
          new = "Secure checkout powered by Stripe. Domain registration begins only after payment is confirmed."
          if old not in s:
              raise SystemExit('staging live note not found')
          s = s.replace(old, new, 1)
          s = s.replace("const API_VERSION = '20260830-domain-owner-4';", "const API_VERSION = '20260830-domain-owner-5';", 1)
          p.write_text(s)

          bridge = Path('js/domain-config-bridge-staging.js')
          b = bridge.read_text().replace('domain-owner-4', 'domain-owner-5')
          bridge.write_text(b)

          page = Path('domains.html')
          h = page.read_text().replace('domain-owner-4', 'domain-owner-5')
          page.write_text(h)
          PY
      - name: Validate checkout JavaScript
        run: node --check js/domain-stripe-checkout-staging.js && node --check js/domain-config-bridge-staging.js
      - name: Commit checkout copy cleanup
        run: |
          git config user.name 'LIW Cards Staging Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/domain-stripe-checkout-staging.js js/domain-config-bridge-staging.js domains.html
          git commit -m 'Remove staging-only domain checkout warning'
          git push
