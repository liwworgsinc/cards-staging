<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#101a39">
<title>External card preview | LIW Cards</title>
<style>
  :root{font-family:Inter,"DM Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17213c;background:#edf0f6}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{min-height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  button,a{font:inherit}
  .preview-toolbar{flex:0 0 auto;min-height:72px;padding:12px max(18px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-bottom:1px solid #e1e6ef;z-index:2}
  .preview-brand{display:flex;align-items:center;gap:11px;min-width:0}
  .preview-mark{height:38px;width:38px;flex:none;border-radius:12px;background:#101a39;color:#fff;display:grid;place-items:center;font-size:12px;letter-spacing:-.04em;font-weight:900}
  .preview-heading{display:grid;gap:3px;min-width:0}
  .preview-heading strong{font-size:14px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .preview-heading span{font-size:11px;line-height:1.25;color:#66738a}
  .preview-actions{display:flex;align-items:center;gap:8px;flex:none}
  .preview-action{border:1px solid #d7dfec;background:#fff;color:#101a39;text-decoration:none;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;padding:0 14px;font-weight:750;font-size:12px;cursor:pointer}
  .preview-action:focus-visible{outline:3px solid #5b80dd;outline-offset:2px}
  .preview-action.primary{background:#101a39;border-color:#101a39;color:#fff}
  .preview-action svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .preview-workspace{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:auto;padding:18px 16px 20px;background:radial-gradient(circle at 50% -20%,#fff 0,#f2f4f8 47%,#e8edf4 100%)}
  .preview-phone{position:relative;display:block;flex:0 1 auto;width:414px;max-width:100%;height:min(822px,calc(100dvh - 162px));min-height:400px;padding:11px;border:2px solid #303947;border-radius:45px;background:linear-gradient(145deg,#333d4c,#101725 46%,#2e3541);box-shadow:0 22px 60px rgba(12,23,49,.21),inset 0 0 0 1px rgba(255,255,255,.12)}
  .preview-screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:33px;background:#fff}
  .preview-frame{display:block;width:100%;height:100%;border:0;background:#fff}
  .preview-camera{position:absolute;left:50%;top:4px;transform:translateX(-50%);width:62px;height:4px;border-radius:8px;background:#626e80;pointer-events:none}
  .preview-home{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:70px;height:3px;border-radius:8px;background:#626e80;pointer-events:none}
  .preview-caption{margin:0;color:#6b7690;text-align:center;font-size:11px;line-height:1.45}
  .preview-error{display:none;max-width:420px;padding:26px;border:1px solid #dce3ed;border-radius:18px;background:#fff;text-align:center;box-shadow:0 20px 55px rgba(12,23,49,.1)}
  .preview-error strong{font-size:18px}
  .preview-error p{line-height:1.5;color:#66738a}
  body.has-error .preview-phone,body.has-error .preview-caption{display:none}
  body.has-error .preview-error{display:block}
  @media(max-width:700px){
    .preview-toolbar{min-height:62px;padding:8px 10px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
    .preview-mark{height:32px;width:32px;border-radius:10px;font-size:10px}
    .preview-brand{gap:7px}
    .preview-heading strong{font-size:12px}
    .preview-heading span{font-size:10px}
    .preview-actions{gap:5px}
    .preview-action{min-height:39px;padding:0 10px;font-size:11px}
    .preview-workspace{padding:0;gap:0;overflow:hidden;background:#fff}
    .preview-phone{width:100%;height:100%;min-height:0;max-width:none;border:0;border-radius:0;box-shadow:none;background:#fff;padding:0}
    .preview-screen{border-radius:0}
    .preview-camera,.preview-home,.preview-caption{display:none}
  }
  @media(max-width:380px){
    .preview-action{padding:0 8px}
    .preview-heading span{display:none}
    .preview-brand{gap:5px}
  }
</style>
</head>
<body>
<header class="preview-toolbar">
  <div class="preview-brand"><span class="preview-mark" aria-hidden="true">LIW</span><div class="preview-heading"><strong>External card preview</strong><span>Actual mobile card · staging</span></div></div>
  <div class="preview-actions">
    <button class="preview-action" id="refresh-preview" type="button" aria-label="Refresh card preview">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.4 5.7M20 4v7h-7"/></svg><span>Refresh</span>
    </button>
    <a class="preview-action primary" id="close-preview" href="editor.html" aria-label="Close preview and return to editor">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg><span>Close</span>
    </a>
  </div>
</header>
<main class="preview-workspace">
  <section class="preview-phone" aria-label="Smartphone card preview">
    <span class="preview-camera" aria-hidden="true"></span>
    <div class="preview-screen"><iframe class="preview-frame" id="preview-frame" title="Interactive LIW business card" allow="autoplay; clipboard-write; web-share; fullscreen" loading="eager" referrerpolicy="same-origin"></iframe></div>
    <span class="preview-home" aria-hidden="true"></span>
  </section>
  <p class="preview-caption">The live card renderer at mobile width. The phone frame is preview-only.</p>
  <div class="preview-error" role="alert"><strong>Card preview unavailable</strong><p>A card address was not provided. Return to your cards or editor and try again.</p><a class="preview-action primary" id="error-back" href="editor.html">Return</a></div>
</main>
<script>
(function(){
  'use strict';
  const params=new URLSearchParams(location.search);
  const slug=String(params.get('slug')||'').trim();
  const fromDashboard=params.get('source')==='dashboard';
  const returnUrl=new URL(fromDashboard?'dashboard.html':'editor.html',location.href);
  const cardId=String(params.get('card_id')||'').trim();
  if(cardId&&!fromDashboard)returnUrl.searchParams.set('id',cardId);
  document.getElementById('close-preview').href=returnUrl.href;
  document.getElementById('error-back').href=returnUrl.href;
  if(!slug){document.body.classList.add('has-error');return;}
  const frame=document.getElementById('preview-frame');
  const cardUrl=new URL('card.html',location.href);
  cardUrl.searchParams.set('slug',slug);
  // Drafts need the signed-in owner/editor session; published dashboard View uses
  // the regular public route so it matches exactly what customers receive.
  if(params.get('mode')!=='public')cardUrl.searchParams.set('editor_preview','1');
  const experience=String(params.get('experience')||'').trim().toLowerCase();
  if(experience)cardUrl.searchParams.set('experience',experience);
  function loadCard(){
    cardUrl.searchParams.set('_liw_preview',String(Date.now()));
    frame.src=cardUrl.href;
  }
  document.getElementById('refresh-preview').addEventListener('click',loadCard);
  document.getElementById('close-preview').addEventListener('click',function(event){
    if(window.opener&&!window.opener.closed){
      event.preventDefault();
      window.close();
      setTimeout(function(){if(!window.closed)location.assign(returnUrl.href);},180);
    }
  });
  loadCard();
})();
</script>
</body>
</html>
